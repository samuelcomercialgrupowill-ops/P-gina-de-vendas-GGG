<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#140A26;--card:#22123F;--line:#3A2466;--pink:#FF4FA3;--orange:#FF8A3D;--purple:#9B5CFF;--cyan:#2EE6D6;--ink:#1A0B2E}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1080px;background:var(--bg);font-family:Inter,sans-serif;color:#F2ECFF;overflow:hidden;position:relative}
.stripe{position:absolute;top:0;left:0;right:0;height:16px;background:linear-gradient(90deg,var(--pink) 0 25%,var(--orange) 25% 50%,var(--purple) 50% 75%,var(--cyan) 75%)}
.sun{position:absolute;left:50%;top:560px;width:700px;height:700px;transform:translateX(-50%);border-radius:50%;
 background:repeating-linear-gradient(180deg,transparent 0 34px,var(--bg) 34px 46px) bottom/100% 48% no-repeat,linear-gradient(180deg,var(--orange),var(--pink) 55%,var(--purple));opacity:.55}
.glow{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 85%,rgba(255,79,163,.35),transparent 70%)}
.grid{position:absolute;left:-200px;right:-200px;bottom:0;height:300px;transform:perspective(500px) rotateX(58deg);transform-origin:bottom;
 background:repeating-linear-gradient(90deg,rgba(46,230,214,.55) 0 2px,transparent 2px 70px),repeating-linear-gradient(0deg,rgba(155,92,255,.6) 0 2px,transparent 2px 46px);
 -webkit-mask:linear-gradient(transparent,#000 40%)}
.fade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,rgba(20,10,38,.6))}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:78px 70px 0}
.brand{display:flex;align-items:center;gap:16px;font-family:Anton;font-size:64px;letter-spacing:4px;text-transform:uppercase;text-shadow:0 0 30px rgba(255,79,163,.6)}
.brand svg{width:58px;height:58px;color:var(--pink);filter:drop-shadow(0 0 14px rgba(255,79,163,.8))}
.tag{margin-top:26px;padding:12px 24px;border-radius:999px;border:2px solid var(--line);background:rgba(155,92,255,.2);color:var(--cyan);font-weight:800;font-size:24px;letter-spacing:2px;text-transform:uppercase}
h1{font-family:Anton;font-weight:400;text-transform:uppercase;font-size:104px;line-height:1.02;margin-top:34px;text-shadow:0 6px 0 rgba(0,0,0,.25),0 0 40px rgba(255,79,163,.4)}
h1 span{text-shadow:none;filter:drop-shadow(0 0 18px rgba(255,79,163,.55));background:linear-gradient(90deg,var(--pink),var(--orange));-webkit-background-clip:text;color:transparent}
.sub{margin-top:26px;font-size:32px;font-weight:600;color:#E6DCFF}
.sub b{color:var(--cyan)}
.clips{position:absolute;bottom:70px;left:0;right:0;display:flex;justify-content:center;gap:26px}
.clip{width:150px;height:240px;border-radius:20px;border:3px solid rgba(255,255,255,.85);display:flex;align-items:flex-end;padding:12px;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.clip:nth-child(1){background:linear-gradient(160deg,var(--purple),var(--pink));transform:rotate(-7deg) translateY(10px)}
.clip:nth-child(2){background:linear-gradient(160deg,var(--pink),var(--orange));transform:translateY(-14px)}
.clip:nth-child(3){background:linear-gradient(160deg,var(--purple),var(--cyan));transform:rotate(7deg) translateY(10px)}
.clip span{width:100%;background:rgba(20,10,38,.88);border-radius:10px;padding:8px 4px;font-size:16px;font-weight:800;text-transform:uppercase;text-align:center}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-80%);width:54px;height:54px;border-radius:50%;background:rgba(20,10,38,.55);display:grid;place-items:center}
.clip{position:relative}
</style></head><body>
<div class="sun"></div><div class="glow"></div><div class="grid"></div><div class="fade"></div><div class="stripe"></div>
<div class="c">
  <div class="brand"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>Corte Star</div>
  <div class="tag">A nova onda do mercado de cortes</div>
  <h1>Ganhe dinheiro<br>com o seu<br><span>streamer favorito</span></h1>
  <p class="sub">A <b>IA</b> assiste, corta, legenda e posta por você</p>
</div>
<div class="clips">
  <div class="clip"><div class="play"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="#fff" d="M8 5v14l11-7z"/></svg></div><span>Corte 01</span></div>
  <div class="clip"><div class="play"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="#fff" d="M8 5v14l11-7z"/></svg></div><span>Corte 02</span></div>
  <div class="clip"><div class="play"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="#fff" d="M8 5v14l11-7z"/></svg></div><span>Corte 03</span></div>
</div>
</body></html>
