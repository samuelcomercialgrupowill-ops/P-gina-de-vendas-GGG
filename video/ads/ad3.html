<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine.css">
<style>
.strike{position:absolute;left:-30px;right:-30px;top:50%;height:6px;border-radius:6px;background:var(--coral);transform-origin:left;box-shadow:0 0 24px rgba(255,106,61,.8)}
.days{display:grid;grid-template-columns:repeat(7,74px);gap:8px;align-items:end}
.days .dc{display:flex;flex-direction:column;align-items:center;gap:8px}
.days .th{width:70px;height:124px;border-radius:12px;background:#1A1A20 center/cover;border:2px solid #FF8A4D;opacity:0}
.days .dn{width:70px;height:44px;border-radius:10px;background:#16161B;border:1px solid #30303A;font:700 13px Inter;color:var(--muted);display:grid;place-items:center}
.days .dn.on{background:var(--coral);color:#140804;border-color:var(--coral)}
.nomad{display:flex;align-items:center;gap:16px;margin-top:34px;padding:14px 20px;border-radius:999px;background:#141418;border:1px solid #30303A;font:700 21px Inter;opacity:0}
</style>
</head><body>
<div class="stage"><div class="cam" id="cam">
  <div class="obj" id="s_hero"><div class="box"><div class="phone"><img id="iA" alt=""><span class="ok" id="okA">✓ Pronto pra postar</span><div class="sheen"></div></div></div></div>
  <div class="obj" id="s_noed"><div class="box" style="display:flex;flex-direction:column;align-items:center">
    <div class="card ed" style="opacity:.55"><div class="bar"><i></i><i></i><i></i></div><div class="prev"></div><div class="tr"><b style="left:2%;width:26%"></b><b style="left:31%;width:18%"></b></div><div class="tr"><b style="left:6%;width:44%"></b></div><div class="tr"><b style="left:3%;width:60%"></b></div></div>
    <div class="strike" id="stk" style="top:150px"></div><div class="timer" id="zero">0 min editando</div></div></div>
  <div class="obj" id="s_ai"><div class="box"><div class="spark" id="spk" style="width:190px;height:190px;border-radius:52px"><div class="ring" id="rg1"></div><div class="ring" id="rg2"></div><div class="ring" id="rg3"></div><svg width="100" height="100" viewBox="0 0 24 24"><path fill="#fff" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg></div></div></div>
  <div class="obj" id="s_pipe"><div class="box pipe">
    <div class="card st" id="p1"><div class="ic">1</div><b>Assistiu a live</b><span class="ck">✓</span></div>
    <div class="card st" id="p2"><div class="ic">2</div><b>Achou o momento</b><span class="ck">✓</span></div>
    <div class="card st" id="p3"><div class="ic">3</div><b>Colocou a legenda</b><span class="ck">✓</span></div>
    <div class="card st" id="p4"><div class="ic">4</div><b>Entregou em pé</b><span class="ck">✓</span></div></div></div>
  <div class="obj" id="s_B"><div class="box"><div class="phone"><img id="iB" alt=""><span class="ok" id="okB">✓ 9:16 em pé</span><div class="sheen"></div></div></div></div>
  <div class="obj" id="s_brand"><div class="box" style="display:flex;flex-direction:column;align-items:center;width:640px"><div class="appicon" id="icn"><div class="sheen" style="position:absolute;top:-20%;bottom:-20%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg)"></div><svg width="96" height="96" viewBox="0 0 24 24"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6L20 18M8.6 16.4L20 6"/></g></svg></div><div class="word">Corte <b>Pronto</b></div></div></div>
  <div class="obj" id="s_week"><div class="box" style="display:flex;flex-direction:column;align-items:center"><div class="lbl">CORTE NOVO TODO DIA</div><div class="days" id="days"></div>
    <div class="nomad" id="nm"><div class="moon" style="width:34px;height:34px;box-shadow:inset -9px -3px 0 0 #E9E4D8"></div>Sem madrugada editando</div></div></div>
  <div class="obj" id="s_end"><div class="box" style="display:flex;flex-direction:column;align-items:center;width:640px"><div class="appicon" style="width:130px;height:130px;border-radius:34px"><svg width="74" height="74" viewBox="0 0 24 24"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6L20 18M8.6 16.4L20 6"/></g></svg></div><div class="word" style="font-size:60px;margin-top:22px">Corte <b>Pronto</b></div>
    <svg class="arrow" id="arr" viewBox="0 0 60 130"><path d="M30 6v112M8 92l22 26 22-26" fill="none" stroke="#FF8A4D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</div></div>
<script>
const DN=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'],TN=[1,4,6,8,2,10,5];
document.getElementById('days').innerHTML=DN.map((d,i)=>`<div class="dc"><div class="th" id="dt${i}"></div><div class="dn" id="dd${i}">${d}</div></div>`).join('');
window.AD={OFF:0.15,END:26.3,
LN:[[0,2.351,"Esse [corte] saiu pronto pra postar."],
[2.351,2.769,"Só que [nenhum editor] encostou nele."],
[5.120,2.038,"Quem cortou foi a [IA.]"],
[7.158,5.407,"Ela assistiu a live, achou o momento, colocou a legenda e entregou o vídeo [em pé.]"],
[12.565,1.881,"Isso é o [Corte Pronto.]"],
[14.446,5.956,"Com live todo dia, você tem [corte novo todo dia,] sem passar a madrugada editando."],
[20.402,3.396,"Agora é só tocar em [saiba mais,] aqui embaixo."]],
GLOW:[[0,'255,150,70'],[2.5,'150,150,170'],[5.2,'255,90,45'],[12.7,'255,106,61'],[14.6,'255,150,70']],SCN:[]};
const Ls=i=>AD.LN[i][0]+AD.OFF;
const wt=(li,w)=>W.find(x=>x.line==li&&x.w.startsWith(w)).s;
AD.SCN=[
 {id:'s_hero',a:0,b:Ls(1),upd:(lt,t)=>{const {$,cl,ease}=U;$('okA').style.opacity=cl((lt-0.9)/0.2);$('okA').style.transform=`scale(${(0.7+0.3*ease((lt-0.9)/0.3)).toFixed(3)})`;return setImg('iA','A',0,t,259)}},
 {id:'s_noed',a:Ls(1),b:Ls(2),upd:(lt)=>{const {$,ease}=U;$('stk').style.transform=`scaleX(${ease((lt-0.6)/0.5).toFixed(3)}) rotate(-8deg)`}},
 {id:'s_ai',a:Ls(2),b:Ls(3),upd:(lt)=>{const {$,ease}=U;[1,2,3].forEach(j=>{const p=((lt*0.8)+j/3)%1;const r=$('rg'+j);r.style.width=r.style.height=(190+p*360)+'px';r.style.opacity=((1-p)*0.8).toFixed(3)});$('spk').style.transform=`scale(${(0.6+0.4*ease(lt/0.5)).toFixed(3)}) rotateZ(${(lt*12).toFixed(2)}deg)`}},
 {id:'s_pipe',a:Ls(3),b:()=>wt(3,'vídeo'),upd:(lt,t)=>{const {$,cl,ease}=U;const ts=[wt(3,'assistiu'),wt(3,'achou'),wt(3,'colocou'),wt(3,'entregou')-0.6];
   ts.forEach((s,i)=>{const e=$('p'+(i+1));const k=ease((t-s+0.25)/0.35);e.style.opacity=k;e.style.transform=`translate3d(${Math.round((1-k)*-120)}px,0,0)`;e.querySelector('.ck').style.opacity=cl((t-s-0.35)/0.2)})}},
 {id:'s_B',a:()=>wt(3,'vídeo'),b:Ls(4),upd:(lt,t)=>{const {$,cl}=U;$('okB').style.opacity=cl((lt-0.6)/0.2);return setImg('iB','B',wt(3,'vídeo'),t,204)}},
 {id:'s_brand',a:Ls(4),b:Ls(5),boom:true,inD:0.4,upd:(lt)=>{const {$,ease,cl}=U;$('icn').style.transform=`translate3d(0,0,${Math.round(60*ease(lt/0.6))}px) rotateY(${(20*(1-ease(lt/0.7))).toFixed(2)}deg)`;$('icn').querySelector('.sheen').style.left=(-60+cl((lt-0.3)/0.6)*220)+'%'}},
 {id:'s_week',a:Ls(5),b:Ls(6),upd:(lt,t)=>{const {$,ease,cl}=U;for(let i=0;i<7;i++){const k=ease((lt-0.3-i*0.38)/0.35);$('dd'+i).classList.toggle('on',k>0.5);const th=$('dt'+i);th.style.backgroundImage=TH(TN[i]);th.style.opacity=k;th.style.transform=`translateY(${Math.round((1-k)*40)}px)`}
   const nk=ease((t-wt(5,'madrugada')+0.1)/0.35);$('nm').style.opacity=nk;$('nm').style.transform=`translateY(${Math.round((1-nk)*20)}px)`}},
 {id:'s_end',a:Ls(6),b:99,upd:(lt)=>{const {$}=U;const s=Math.abs(Math.sin(lt*3.2));$('arr').style.transform=`translateY(${Math.round(s*22)}px)`;$('arr').style.opacity=0.65+0.35*s}}
];
</script>
<script src="engine.js"></script>
</body></html>
