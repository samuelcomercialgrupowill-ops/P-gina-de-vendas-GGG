<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine.css">
<style>
.tl{width:560px;height:80px;border-radius:14px;background:repeating-linear-gradient(90deg,#24242B 0 4px,#18181D 4px 8px);position:relative;overflow:hidden;margin-top:22px}
.tl em{position:absolute;top:0;bottom:0;border:3px solid var(--amber);border-radius:9px;background:rgba(255,178,63,.16);opacity:0}
.tl .ph{position:absolute;top:0;bottom:0;width:3px;background:#fff}
.side{display:flex;flex-direction:column;gap:12px;position:absolute;left:300px;top:150px}
.side span{padding:12px 16px;border-radius:12px;background:#141418;border:1px solid #30303A;font:700 18px Inter;white-space:nowrap;opacity:0}
.side span b{color:var(--amber)}
</style>
</head><body>
<div class="stage"><div class="cam" id="cam">
  <div class="obj" id="s_q"><div class="box" style="display:flex;flex-direction:column;align-items:center">
    <div class="card qcard"><div class="sheen"></div><div class="q">?</div><p>Ainda vale a pena?</p></div>
    <div class="card chart"><svg viewBox="0 0 512 252" width="512" height="252"><path d="M0,240 C80,236 120,200 180,190 C260,176 300,120 360,90 C420,60 460,30 512,12" fill="none" stroke="#FFB23F" stroke-width="7" stroke-linecap="round" id="cv" stroke-dasharray="700" stroke-dashoffset="700"/></svg></div></div></div>
  <div class="obj" id="s_live"><div class="box" style="display:flex;flex-direction:column;align-items:center">
    <div class="card live"><div class="sheen"></div><span class="badge">AO VIVO</span><span style="position:absolute;top:18px;left:118px;background:rgba(0,0,0,.55);padding:7px 10px;border-radius:6px;font:800 15px Inter" id="vw">0 assistindo</span><div class="moon" style="position:absolute;right:34px;top:30px;width:70px;height:70px;box-shadow:inset -18px -6px 0 0 #E9E4D8"></div></div>
    <div class="tl" id="tl"><div class="ph" id="tph"></div></div><div class="lbl" style="margin:16px 0 0">MOMENTOS NOVOS TODA NOITE</div></div></div>
  <div class="obj" id="s_post"><div class="box card" style="width:440px"><div class="sheen"></div>
    <div class="prof"><div class="av"></div><div><b>@seu.canal</b><small>1 corte por dia</small></div><div class="cnt"><span id="pc">0</span><small>posts</small></div></div>
    <div class="grid9" id="g9"></div></div></div>
  <div class="obj" id="s_clock"><div class="box" style="display:flex;flex-direction:column;align-items:center">
    <div class="clock" style="width:230px;height:230px"><b id="chh" style="height:60px;margin-top:-60px"></b><i id="cmm" style="height:88px;margin-top:-88px"></i></div>
    <div class="timer" id="tmr">0h 00min</div><div class="lbl" style="margin:10px 0 0">EDITANDO NA MÃO</div></div></div>
  <div class="obj" id="s_ai"><div class="box" style="display:flex;flex-direction:column;align-items:center"><div class="spark" id="spk" style="width:190px;height:190px;border-radius:52px"><div class="ring" id="rg1"></div><div class="ring" id="rg2"></div><div class="ring" id="rg3"></div><svg width="100" height="100" viewBox="0 0 24 24"><path fill="#fff" d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg></div><div class="lbl" style="margin:110px 0 0">A IA FAZ O TRABALHO PESADO</div></div></div>
  <div class="obj" id="s_brand"><div class="box" style="display:flex;flex-direction:column;align-items:center;width:640px"><div class="appicon" id="icn"><div class="sheen" style="position:absolute;top:-20%;bottom:-20%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg)"></div><svg width="96" height="96" viewBox="0 0 24 24"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6L20 18M8.6 16.4L20 6"/></g></svg></div><div class="word">Corte <b>Pronto</b></div></div></div>
  <div class="obj" id="s_get"><div class="box" style="width:600px;height:600px">
    <div class="card app" id="inpc" style="position:absolute;left:0;top:0;width:600px;padding:18px"><div class="inp"><span id="typed"></span><span class="cur" id="cur"></span></div></div>
    <div class="phone" id="ph" style="position:absolute;left:-10px;top:100px;width:262px;height:477px;opacity:0"><img id="iA" alt=""><div class="sheen"></div></div>
    <div class="side" id="side"><span id="c1"><b>✓</b> Corte pronto</span><span id="c2"><b>✓</b> Com legenda</span><span id="c3"><b>✓</b> Formato 9:16</span><span id="c4"><b>✓</b> Pra postar hoje</span></div></div></div>
  <div class="obj" id="s_end"><div class="box" style="display:flex;flex-direction:column;align-items:center;width:640px"><div class="appicon" style="width:130px;height:130px;border-radius:34px"><svg width="74" height="74" viewBox="0 0 24 24"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6L20 18M8.6 16.4L20 6"/></g></svg></div><div class="word" style="font-size:60px;margin-top:22px">Corte <b>Pronto</b></div>
    <svg class="arrow" id="arr" viewBox="0 0 60 130"><path d="M30 6v112M8 92l22 26 22-26" fill="none" stroke="#FF8A4D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
</div></div>
<script>
const thumbs=[3,7,1,9,5,11,2,8,4];
document.getElementById('g9').innerHTML=thumbs.map((n,i)=>`<i id="g${i}"></i>`).join('');
const MK=[[4,7],[16,6],[29,8],[41,5],[52,9],[66,6],[78,7],[89,6]];
document.getElementById('tl').insertAdjacentHTML('afterbegin',MK.map((m,i)=>`<em id="m${i}" style="left:${m[0]}%;width:${m[1]}%"></em>`).join(''));
window.AD={OFF:0.15,END:32.9,
LN:[[0,3.004,"Ainda vale a pena começar um [canal de cortes?]"],
[3.004,6.269,"A live do seu streamer favorito acontece [toda noite,] e todo dia tem momento novo pra cortar."],
[9.273,3.239,"Só que quem cresce é quem [posta todo dia.]"],
[12.513,3.866,"E um corte editado na mão leva [horas] pra ficar pronto."],
[16.379,3.239,"Agora você consegue colocar a [IA] pra fazer isso."],
[19.618,1.959,"Isso é o [Corte Pronto.]"],
[21.577,5.329,"Você escolhe a live e recebe o [corte pronto,] com legenda e no formato certo."],
[26.906,3.553,"Agora é só tocar em [saiba mais,] aqui embaixo."]],
GLOW:[[0,'255,150,70'],[3.2,'255,90,45'],[12.7,'150,150,170'],[16.5,'255,106,61'],[21.7,'255,150,70']],SCN:[]};
const Ls=i=>AD.LN[i][0]+AD.OFF;
const wt=(li,w)=>W.find(x=>x.line==li&&x.w.startsWith(w)).s;
AD.SCN=[
 {id:'s_q',a:0,b:Ls(1),upd:(lt)=>{const {$,eio}=U;$('cv').style.strokeDashoffset=Math.round(700*(1-eio((lt-0.4)/2.2)))}},
 {id:'s_live',a:Ls(1),b:Ls(2),upd:(lt,t)=>{const {$,ease,cl}=U;$('vw').textContent=Math.round(ease(lt/2.5)*31400).toLocaleString('pt-BR')+' assistindo';$('tph').style.left=(cl(lt/6.2)*100)+'%';const t0=wt(1,'todo');MK.forEach((m,i)=>{const k=ease((t-t0-i*0.32)/0.25);$('m'+i).style.opacity=k;$('m'+i).style.transform=`scaleY(${(0.6+0.4*k).toFixed(3)})`})}},
 {id:'s_post',a:Ls(2),b:Ls(3),upd:(lt)=>{const {$,ease}=U;let c=0;thumbs.forEach((n,i)=>{const e=$('g'+i);e.style.backgroundImage=TH(n);const k=ease((lt-0.15-i*0.3)/0.3);e.style.opacity=k;e.style.transform=`scale(${(0.8+0.2*k).toFixed(3)})`;if(k>0.5)c++});$('pc').textContent=c}},
 {id:'s_clock',a:Ls(3),b:Ls(4),upd:(lt)=>{const {$,eio}=U;$('cmm').style.transform=`rotate(${lt*540}deg)`;$('chh').style.transform=`rotate(${lt*45}deg)`;const m=Math.round(eio(lt/3.6)*197);$('tmr').textContent=Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'min'}},
 {id:'s_ai',a:Ls(4),b:Ls(5),upd:(lt)=>{const {$,ease}=U;[1,2,3].forEach(j=>{const p=((lt*0.8)+j/3)%1;const r=$('rg'+j);r.style.width=r.style.height=(190+p*360)+'px';r.style.opacity=((1-p)*0.8).toFixed(3)});$('spk').style.transform=`scale(${(0.6+0.4*ease(lt/0.5)).toFixed(3)}) rotateZ(${(lt*12).toFixed(2)}deg)`}},
 {id:'s_brand',a:Ls(5),b:Ls(6),boom:true,inD:0.4,upd:(lt)=>{const {$,ease,cl}=U;$('icn').style.transform=`translate3d(0,0,${Math.round(60*ease(lt/0.6))}px) rotateY(${(20*(1-ease(lt/0.7))).toFixed(2)}deg)`;$('icn').querySelector('.sheen').style.left=(-60+cl((lt-0.3)/0.6)*220)+'%'}},
 {id:'s_get',a:Ls(6),b:Ls(7),upd:(lt,t)=>{const {$,ease,cl}=U;const url='youtube.com/live/seustreamer';$('typed').textContent=url.slice(0,Math.floor(cl((lt-0.05)/1.1)*url.length));$('cur').style.opacity=(Math.floor(lt*2.5)%2)?1:0.2;
   const pk=ease((lt-1.3)/0.5);$('ph').style.opacity=pk;$('ph').style.transform=`translate3d(0,${Math.round((1-pk)*80)}px,0) rotateY(10deg)`;$('inpc').style.opacity=1-0.5*pk;
   const ts=[wt(6,'corte')-0.1,wt(6,'legenda'),wt(6,'formato'),wt(6,'certo')+0.2];ts.forEach((s,i)=>{const k=ease((t-s)/0.3);const e=$('c'+(i+1));e.style.opacity=k;e.style.transform=`translate3d(${Math.round((1-k)*60)}px,0,0)`});
   return lt>1.2?setImg('iA','A',Ls(6)+1.2,t,259):null}},
 {id:'s_end',a:Ls(7),b:99,upd:(lt)=>{const {$}=U;const s=Math.abs(Math.sin(lt*3.2));$('arr').style.transform=`translateY(${Math.round(s*22)}px)`;$('arr').style.opacity=0.65+0.35*s}}
];
</script>
<script src="engine.js"></script>
</body></html>
