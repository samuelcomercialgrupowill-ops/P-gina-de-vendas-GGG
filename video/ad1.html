<style>
:root{--bg:#060608;--card:#121216;--card2:#17171C;--line:#2A2A32;--coral:#FF6A3D;--amber:#FFB23F;--text:#F7F7F8;--muted:#9A9AA3;--d:"Bricolage Grotesque",Inter,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{width:720px;height:1280px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;position:relative;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

#dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1.4px) 0 0/16px 16px;-webkit-mask:radial-gradient(70% 55% at 50% 40%,#000 30%,transparent 85%)}
#vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.75))}
.stage{position:absolute;left:0;right:0;top:90px;height:680px;perspective:1300px;perspective-origin:50% 40%}
.obj{position:absolute;left:50%;top:50%;transform-style:preserve-3d;opacity:0;display:none}
.card{background:linear-gradient(160deg,#1B1B21,#0F0F13);border:1px solid #2E2E37;border-radius:26px;box-shadow:0 50px 90px -30px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06)}
/* legenda */
#cap{position:absolute;left:70px;right:70px;top:812px;text-align:center;font:600 31px/1.32 Inter;letter-spacing:-.01em}
#cap span{display:inline-block;margin:0 4px;opacity:0;position:relative}
#cap span.k::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;border-radius:3px;background:var(--coral);transform-origin:left;transform:scaleX(var(--u,0))}
/* telefone antigo */
.oldph{width:250px;height:470px;border-radius:38px;padding:58px 18px;background:linear-gradient(160deg,#26262C,#121216);border:2px solid #3A3A44}
.oldph .scr{width:100%;height:100%;border-radius:8px;background:#0B0B0F;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px;align-content:start}
.oldph .scr i{aspect-ratio:1;border-radius:11px;background:#2C2C34}
.oldph .btn{position:absolute;left:50%;bottom:12px;width:36px;height:36px;margin-left:-18px;border-radius:50%;border:2px solid #3A3A44}

.ed{width:540px;padding:20px}
.ed .bar{display:flex;gap:7px;margin-bottom:14px}.ed .bar i{width:11px;height:11px;border-radius:50%;background:#3A3A44}
.ed .prev{height:200px;border-radius:12px;background:linear-gradient(135deg,#202028,#2b1c18);margin-bottom:14px;position:relative;overflow:hidden}
.ed .tr{height:30px;border-radius:7px;background:#1C1C22;position:relative;margin-top:8px;overflow:hidden}
.ed .tr b{position:absolute;top:5px;bottom:5px;border-radius:4px;background:#34343D}
.ed .ph{position:absolute;top:214px;bottom:14px;width:3px;background:var(--coral);left:30px}
.clock{width:130px;height:130px;border-radius:50%;border:3px solid #3A3A44;position:absolute;background:#0E0E12}
.clock i{position:absolute;left:50%;top:50%;width:4px;height:48px;margin-left:-2px;background:var(--coral);transform-origin:50% 100%;margin-top:-48px;border-radius:3px}
.clock b{position:absolute;left:50%;top:50%;width:4px;height:34px;margin-left:-2px;background:var(--text);transform-origin:50% 100%;margin-top:-34px;border-radius:3px}
.timer{position:absolute;font:700 46px var(--d);letter-spacing:-.02em;white-space:nowrap}
/* live */
.live{width:540px;height:300px;overflow:hidden;background:linear-gradient(135deg,#1d1d25,#2b1a24 60%,#4a2416)}
.badge{position:absolute;top:18px;left:18px;background:#FF2D55;color:#fff;font:800 15px Inter;padding:7px 10px;border-radius:6px;letter-spacing:1px}
.week{position:absolute;left:30px;right:30px;bottom:26px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week span{height:54px;border-radius:10px;background:rgba(0,0,0,.45);border:1px solid #34343D;font:700 13px Inter;color:var(--muted);display:grid;place-items:center}
.week span.on{background:var(--coral);color:#140804;border-color:var(--coral)}
/* cartoes 1 2 3 */
.num{width:190px;height:270px;display:grid;place-items:center;font:500 120px var(--d);color:#EDEDF0}
.lbl{position:absolute;left:50%;transform:translateX(-50%);top:-62px;font:700 15px ui-monospace,Menlo,monospace;letter-spacing:3px;color:var(--amber);white-space:nowrap}
/* editor pago */
.inv{width:470px;padding:22px}
.inv h4{font:700 22px Inter;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:#0C0C10;border:1px solid #24242B;margin-top:8px}
.row i{width:54px;height:34px;border-radius:6px;background:linear-gradient(135deg,#30303A,#4a2416)}
.row span{flex:1;font:600 17px Inter;color:#D4D4DA}
.row b{width:22px;height:22px;border-radius:50%;background:var(--coral)}
.coins{position:absolute;right:-70px;bottom:10px;width:90px}
.coins i{display:block;height:20px;margin-top:-8px;border-radius:50%;background:linear-gradient(180deg,#FFC766,#E08A1E);border:2px solid #A35F10}
/* opcao 3 */
.ai{width:300px;height:480px;border:2px solid var(--coral);box-shadow:0 0 0 6px rgba(255,106,61,.12),0 0 70px rgba(255,106,61,.45),0 50px 90px -30px #000;display:grid;place-items:center}
.spark{position:absolute;top:-46px;left:50%;margin-left:-46px;width:92px;height:92px;border-radius:24px;background:linear-gradient(150deg,#FF8A4D,#FF5A2D);display:grid;place-items:center;box-shadow:0 20px 50px -10px rgba(255,90,45,.8)}
.mini{width:230px;height:418px;border-radius:30px;overflow:hidden;border:5px solid #0A0A0D;position:relative;background:#000}
.mini img,.phone img{width:100%;height:100%;object-fit:cover;display:block}
/* marca */
.appicon{width:170px;height:170px;border-radius:44px;background:linear-gradient(150deg,#FF9A55,#FF5A2D 70%);display:grid;place-items:center;box-shadow:0 30px 80px -10px rgba(255,90,45,.75),inset 0 2px 0 rgba(255,255,255,.35)}
.word{font:600 72px var(--d);letter-spacing:-.03em;margin-top:30px;white-space:nowrap;text-align:center}
.word b{font-weight:800;color:var(--amber)}
/* demo */
.app{width:600px;padding:22px}
.app .top{display:flex;align-items:center;gap:10px;font:700 18px Inter;margin-bottom:18px}
.app .top svg{color:var(--coral)}
.inp{height:58px;border-radius:14px;background:#0B0B0F;border:1px solid #2E2E37;padding:0 18px;display:flex;align-items:center;font:500 20px ui-monospace,Menlo,monospace;color:#E4E4E7}
.inp .cur{width:2px;height:26px;background:var(--amber);margin-left:2px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.chips span{padding:14px;border-radius:12px;border:1px solid #2E2E37;font:700 17px Inter;color:#71717A;display:flex;align-items:center;gap:10px}
.chips span i{width:18px;height:18px;border-radius:50%;border:2px solid #3F3F46}
.chips span.on{color:var(--text);border-color:#4A3A30;background:#1A1411}
.chips span.on i{background:var(--amber);border-color:var(--amber)}
.go{margin-top:16px;height:60px;border-radius:14px;background:linear-gradient(90deg,var(--coral),var(--amber));color:#170A04;font:800 19px Inter;display:grid;place-items:center;letter-spacing:.5px}
.cursor{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,255,255,.2)}
.phone{width:284px;height:517px;border-radius:42px;overflow:hidden;border:8px solid #0A0A0D;box-shadow:0 0 0 2px #2E2E37,0 50px 90px -20px rgba(255,106,61,.4);background:#000;position:relative}
.ok{position:absolute;top:16px;left:16px;background:#FAFAFA;color:#09090B;font:800 16px Inter;padding:8px 12px;border-radius:999px}
/* final */
.arrow{width:120px;height:260px;margin-top:40px;filter:drop-shadow(0 0 18px rgba(255,106,61,.9)) drop-shadow(0 0 40px rgba(255,106,61,.6))}
</style></head><body>
